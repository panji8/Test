<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
<title>Cek Ketersediaan Agent - Suruhboy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.agent-check-page {
  display: block;
  min-height: 100vh;
  background: #F5F6FA;
}
.agent-check-container {
  max-width: 500px;
  margin: 0 auto;
  padding: 0 16px 40px;
  min-height: 100vh;
}
.agent-check-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding-top: 12px;
}
.agent-back-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid #E2E6ED;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  cursor: pointer;
}
.agent-check-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.agent-check-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.agent-check-sub {
  font-size: 13px;
  color: #7A8BA0;
  margin-bottom: 20px;
}
.agent-form-group {
  margin-bottom: 20px;
}
.agent-form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}
.agent-select {
  width: 100%;
  padding: 14px 16px;
  background: #F5F6FA;
  border: 1px solid #E2E8F0;
  border-radius: 16px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.btn-check-agent {
  width: 100%;
  padding: 14px;
  background: #25D366;
  border: none;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.agent-result-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
  text-align: center;
}
.agent-status-icon {
  width: 64px;
  height: 64px;
  border-radius: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin: 0 auto 16px;
}
.agent-status-ready {
  background: #DCFCE7;
  color: #15803D;
}
.agent-status-none {
  background: #FEE2E2;
  color: #B91C1C;
}
.agent-result-message {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}
.agent-result-detail {
  font-size: 13px;
  color: #7A8BA0;
}
.agent-badge-count {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #F1F5F9;
  padding: 6px 12px;
  border-radius: 40px;
  font-size: 12px;
  margin-top: 12px;
}
.agent-action-buttons {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}
.btn-order-agent {
  flex: 1;
  background: #E88D2A;
  border: none;
  padding: 12px;
  border-radius: 40px;
  font-weight: 600;
  color: white;
  cursor: pointer;
}
.btn-reset-agent {
  flex: 1;
  background: #F1F5F9;
  border: none;
  padding: 12px;
  border-radius: 40px;
  font-weight: 600;
  color: #475569;
  cursor: pointer;
}
.agent-info-box {
  background: #EFF6FF;
  border-radius: 12px;
  padding: 12px;
  margin-top: 16px;
  font-size: 12px;
  color: #1E40AF;
}
.agent-footer {
  text-align: center;
  padding: 20px;
  color: #94A3B8;
  font-size: 12px;
}
.hidden { display: none; }
</style>
</head>
<body>
<div class="agent-check-page">
  <div class="agent-check-container">
    <div class="agent-check-header">
      <a href="../index.html" class="agent-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div>
        <h2 style="font-size:18px; font-weight:700;">Cek Ketersediaan Agent</h2>
        <p style="font-size:12px; color:#7A8BA0;">Lihat agent online di kecamatan Anda</p>
      </div>
    </div>
    
    <div class="agent-check-card">
      <div class="agent-check-title">
        <i class="fas fa-map-marker-alt" style="color:#E88D2A;"></i>
        <span>Pilih Area Jemput</span>
      </div>
      <div class="agent-check-sub">Pastikan area jemput adalah titik pertama untuk pick up barang/jemput Anda</div>
      <div class="agent-form-group">
        <label><i class="fas fa-map-pin"></i> Kecamatan</label>
        <select id="areaSelect" class="agent-select">
          <option value="" disabled selected>-- Pilih Kecamatan --</option>
        </select>
      </div>
      <button class="btn-check-agent" id="checkAgentBtn">
        <i class="fas fa-search"></i> Cek Ketersediaan Agent
      </button>
    </div>
    
    <div id="agentResultSection" class="hidden"></div>
    <div class="agent-footer">
      <i class="fas fa-clock"></i> Data ketersediaan diperbarui secara real-time dari database agent
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/agent.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  populateAreaSelect();
  document.getElementById('checkAgentBtn').addEventListener('click', checkAgentAvailability);
});
</script>
</body>
</html>
